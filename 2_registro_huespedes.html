<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Registro de Huéspedes — Hotel Las Quenas</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --primary: #755b00; --primary-c: #c9a227; --surface: #fff8f5;
    --on-surface: #2f1500; --secondary: #865225; --container: #ffeadc;
    --container-low: #fff1e9; --outline: #d1c5af; --error: #ba1a1a;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Work Sans', sans-serif; background: var(--surface); color: var(--on-surface); min-height: 100vh; margin: 0; }
  .font-serif { font-family: 'Noto Serif', serif; }
  .ms { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; display: inline-block; line-height: 1; }

  .field-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #4d4635; font-weight: 600; margin-bottom: 6px; display: block; }
  .field-input {
    width: 100%; padding: 14px 16px; background: white; border: 1.5px solid var(--outline);
    border-radius: 10px; font-size: 15px; color: var(--on-surface); transition: border-color .2s;
    font-family: 'Work Sans', sans-serif; outline: none;
  }
  .field-input:focus { border-color: var(--primary); }
  .field-input.error { border-color: var(--error); }
  select.field-input { cursor: pointer; }

  .guest-card {
    background: var(--container-low); border-radius: 16px; padding: 24px;
    border-left: 4px solid var(--primary); margin-bottom: 16px;
    animation: slideIn .3s ease;
  }
  .guest-card.secondary { border-left-color: var(--secondary); background: white; border: 1px solid var(--outline); border-left: 4px solid var(--secondary); }
  @keyframes slideIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  .upload-zone {
    border: 2px dashed var(--outline); border-radius: 12px; padding: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; transition: all .2s; background: white;
    position: relative; overflow: hidden;
  }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background: var(--container-low); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-preview { width: 100%; border-radius: 8px; overflow: hidden; position: relative; }
  .upload-preview img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; }
  .upload-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(117,91,0,0.9); color: white; border-radius: 100px;
    padding: 4px 10px; font-size: 11px; font-weight: 600;
  }

  .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
  .radio-opt { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .radio-opt input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
  .radio-opt span { font-size: 14px; color: var(--on-surface); }

  .btn-primary {
    width: 100%; padding: 18px; background: linear-gradient(135deg, var(--primary), var(--primary-c));
    color: white; border: none; border-radius: 14px; font-family: 'Work Sans', sans-serif;
    font-size: 15px; font-weight: 600; letter-spacing: .06em; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .15s, box-shadow .15s; box-shadow: 0 6px 20px rgba(117,91,0,0.25);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(117,91,0,0.3); }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .btn-add {
    width: 100%; padding: 14px; border: 2px dashed var(--outline); border-radius: 12px;
    background: transparent; color: var(--secondary); font-family: 'Work Sans', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 8px; transition: all .2s;
  }
  .btn-add:hover { border-color: var(--primary); color: var(--primary); background: var(--container-low); }

  .progress-bar {
    display: flex; gap: 6px; align-items: center; justify-content: center; margin-bottom: 32px;
  }
  .progress-step {
    width: 32px; height: 4px; border-radius: 2px; background: var(--outline); transition: background .3s;
  }
  .progress-step.done { background: var(--primary); }
  .progress-step.active { background: var(--primary-c); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%;
    background: rgba(255,248,245,0.95); backdrop-filter: blur(16px);
    border-top: 1px solid var(--outline); display: flex;
    justify-content: space-around; padding: 10px 0 20px; z-index: 100;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 12px; border-radius: 10px; text-decoration: none;
    color: var(--secondary); font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    opacity: .7; transition: opacity .2s;
  }
  .nav-item.active { background: var(--container); color: var(--primary); opacity: 1; }

  /* Spinner */
  .spinner {
    width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white; border-radius: 50%;
    animation: spin .7s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avif-info {
    background: var(--container); border-radius: 8px; padding: 10px 14px;
    font-size: 12px; color: #4d4635; display: flex; align-items: center; gap: 8px;
  }
</style>
</head>
<body>

<!-- Header -->
<header style="background:rgba(255,248,245,0.95); backdrop-filter:blur(16px); border-bottom:1px solid var(--outline); padding:16px 24px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50;">
  <a href="1_bienvenida.html" id="btn-back" style="color:var(--primary); background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:4px; text-decoration:none; font-size:14px;">
    <span class="ms">arrow_back</span>
  </a>
  <div style="flex:1; text-align:center;">
    <div class="font-serif" style="font-size:16px; color:var(--primary); font-weight:700;">Hotel Las Quenas</div>
  </div>
  <div style="width:28px;"></div>
</header>

<main style="max-width:640px; margin:0 auto; padding:24px 20px 140px;">

  <!-- Progress -->
  <div class="progress-bar">
    <div class="progress-step done"></div>
    <div class="progress-step active"></div>
    <div class="progress-step"></div>
    <div class="progress-step"></div>
    <div class="progress-step"></div>
  </div>

  <div style="margin-bottom:28px;">
    <h1 class="font-serif" style="font-size:26px; margin:0 0 8px;">Registro de Huéspedes</h1>
    <p style="color:#4d4635; font-size:14px; margin:0;">Complete los datos de todos los que le acompañan.</p>
  </div>

  <!-- Contenedor de cards de huéspedes -->
  <div id="guests-container"></div>

  <!-- Botón agregar acompañante -->
  <button class="btn-add" onclick="agregarHuesped()" id="btn-agregar" style="margin-bottom:24px;">
    <span class="ms">person_add</span>
    Añadir otro acompañante
  </button>

  <!-- Continuar -->
  <button class="btn-primary" onclick="continuar()" id="btn-continuar">
    <div class="spinner" id="spinner"></div>
    <span id="btn-texto">CONTINUAR</span>
    <span class="ms" id="btn-icon">arrow_forward</span>
  </button>

  <p style="text-align:center; font-size:11px; color:#7f7663; margin-top:12px; text-transform:uppercase; letter-spacing:.06em;">Paso 2 de 5 · Registro de huéspedes</p>

</main>

<nav class="bottom-nav">
  <a class="nav-item" href="1_bienvenida.html" id="nav-home"><span class="ms">home</span>Inicio</a>
  <a class="nav-item active" href="#"><span class="ms">how_to_reg</span>Registro</a>
  <a class="nav-item" href="#"><span class="ms">restaurant</span>Comedor</a>
  <a class="nav-item" href="#"><span class="ms">explore</span>Tours</a>
</nav>

<script>
// ── Utils ──────────────────────────────────────────────────
function getParam(k) { return new URLSearchParams(window.location.search).get(k); }
const idReserva = getParam("r") || ("QNS-TMP-" + Date.now());
const nombreParam = getParam("n") || "";

// Pasar parámetros al link back
const backLink = document.getElementById("btn-back");
if (getParam("r")) {
  const p = new URLSearchParams({ r: getParam("r") });
  if (getParam("n")) p.set("n", getParam("n"));
  if (getParam("f")) p.set("f", getParam("f"));
  backLink.href = "1_bienvenida.html?" + p.toString();
}

// ── Estado global ──────────────────────────────────────────
let huespedes = []; // Array de objetos {campos, fotoDataUrl}
let contadorHuespedes = 0;

// ── Crear card de huésped ──────────────────────────────────
function crearCardHuesped(estitular = true, index = 0) {
  const id = "h" + index;
  const titulo = esTitular ? "Huésped Principal" : "Acompañante " + index;
  const esAdulto = true;

  const div = document.createElement("div");
  div.className = "guest-card" + (esTitular ? "" : " secondary");
  div.id = "card-" + id;
  div.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="ms" style="color:var(--${esTitular ? "primary" : "secondary"}); font-size:22px; font-variation-settings:'FILL' 1;">${esTitular ? "person" : "person_add"}</span>
        <div>
          <div class="font-serif" style="font-size:16px; font-weight:700;">${titulo}</div>
          ${esTitular ? '<div style="font-size:11px; color:#7f7663; text-transform:uppercase; letter-spacing:.06em;">Titular de la reserva</div>' : ''}
        </div>
      </div>
      ${!esTitular ? `<button onclick="eliminarHuesped('${id}')" style="background:none; border:none; cursor:pointer; color:var(--error); padding:6px; border-radius:8px;"><span class="ms">delete_outline</span></button>` : ""}
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">

      <!-- Nombre -->
      <div style="grid-column:1/-1;">
        <label class="field-label">Nombre Completo *</label>
        <input class="field-input" id="${id}-nombre" type="text" placeholder="Ej. Juan Pérez"
          value="${esTitular && nombreParam ? nombreParam : ""}"
          oninput="guardarCampo('${id}','nombre',this.value)"/>
      </div>

      <!-- Email (solo titular) -->
      ${esTitular ? `
      <div style="grid-column:1/-1;">
        <label class="field-label">Email *</label>
        <input class="field-input" id="${id}-email" type="email" placeholder="correo@ejemplo.com"
          oninput="guardarCampo('${id}','email',this.value)"/>
      </div>` : ""}

      <!-- Tipo (acompañante) -->
      ${!esTitular ? `
      <div style="grid-column:1/-1;">
        <label class="field-label">Tipo de Huésped</label>
        <div class="radio-group">
          <label class="radio-opt">
            <input type="radio" name="${id}-tipo" value="adulto" checked onchange="guardarCampo('${id}','tipo',this.value)"/>
            <span>Adulto</span>
          </label>
          <label class="radio-opt">
            <input type="radio" name="${id}-tipo" value="nino" onchange="guardarCampo('${id}','tipo',this.value)"/>
            <span>Niño</span>
          </label>
        </div>
      </div>` : ""}

      <!-- Teléfono (solo titular) -->
      ${esTitular ? `
      <div>
        <label class="field-label">País</label>
        <select class="field-input" id="${id}-codigo" onchange="guardarCampo('${id}','codigo',this.value)">
          <option value="51">PE +51</option>
          <option value="54">AR +54</option>
          <option value="56">CL +56</option>
          <option value="57">CO +57</option>
          <option value="1">US +1</option>
          <option value="44">UK +44</option>
          <option value="34">ES +34</option>
          <option value="49">DE +49</option>
          <option value="55">BR +55</option>
        </select>
      </div>
      <div>
        <label class="field-label">Teléfono *</label>
        <input class="field-input" id="${id}-telefono" type="tel" placeholder="987 341 632"
          oninput="guardarCampo('${id}','telefono',this.value)"/>
      </div>` : ""}

      <!-- Canal contacto (solo titular) -->
      ${esTitular ? `
      <div style="grid-column:1/-1;">
        <label class="field-label">Contacto Preferido</label>
        <div class="radio-group">
          <label class="radio-opt">
            <input type="radio" name="${id}-canal" value="WhatsApp" checked onchange="guardarCampo('${id}','canal',this.value)"/>
            <span>WhatsApp</span>
          </label>
          <label class="radio-opt">
            <input type="radio" name="${id}-canal" value="WeChat" onchange="guardarCampo('${id}','canal',this.value)"/>
            <span>WeChat</span>
          </label>
          <label class="radio-opt">
            <input type="radio" name="${id}-canal" value="Llamada" onchange="guardarCampo('${id}','canal',this.value)"/>
            <span>Llamada</span>
          </label>
        </div>
      </div>` : ""}

      <!-- Nro Documento -->
      <div style="grid-column:1/-1;">
        <label class="field-label">Tipo de Documento</label>
        <div class="radio-group" style="margin-bottom:10px;">
          <label class="radio-opt">
            <input type="radio" name="${id}-tipdoc" value="DNI" checked onchange="guardarCampo('${id}','tipdoc',this.value)"/>
            <span>DNI</span>
          </label>
          <label class="radio-opt">
            <input type="radio" name="${id}-tipdoc" value="Pasaporte" onchange="guardarCampo('${id}','tipdoc',this.value)"/>
            <span>Pasaporte</span>
          </label>
          <label class="radio-opt">
            <input type="radio" name="${id}-tipdoc" value="Cédula" onchange="guardarCampo('${id}','tipdoc',this.value)"/>
            <span>Cédula</span>
          </label>
        </div>
        <input class="field-input" id="${id}-nrodoc" type="text" placeholder="Número de documento"
          oninput="guardarCampo('${id}','nrodoc',this.value)"/>
      </div>

      <!-- Upload foto documento -->
      <div style="grid-column:1/-1;">
        <label class="field-label">Foto del Documento *</label>
        <div class="avif-info" style="margin-bottom:10px;">
          <span class="ms" style="color:var(--primary); font-size:18px;">photo_camera</span>
          <span>La imagen se optimizará automáticamente en formato AVIF para ahorrar espacio.</span>
        </div>
        <div class="upload-zone" id="zone-${id}" ondragover="dragOver(event,'${id}')" ondragleave="dragLeave('${id}')" ondrop="dropFile(event,'${id}')">
          <input type="file" accept="image/*" capture="environment" onchange="procesarFoto(this,'${id}')"/>
          <div id="upload-content-${id}">
            <span class="ms" style="font-size:36px; color:var(--outline);">add_a_photo</span>
            <p style="font-size:13px; color:#7f7663; text-align:center; margin:4px 0 0;">Toca para fotografiar o cargar<br/><strong>DNI, Pasaporte o Cédula</strong></p>
          </div>
        </div>
        <div id="foto-status-${id}" style="font-size:12px; color:var(--primary); margin-top:6px; display:none;"></div>
      </div>

    </div>
  `;

  return div;
}

// Workaround para closure del template literal
let esTemporalTitular = true;
function crearCard(esT, idx) {
  esTemporalTitular = esT;
  return crearCardHuesped(esT, idx);
}
// Alias limpio
function crearCardHuesped(esT, idx) {
  const id = "h" + idx;
  const titulo = esT ? "Huésped Principal" : ("Acompañante " + idx);
  const div = document.createElement("div");
  div.className = "guest-card" + (esT ? "" : " secondary");
  div.id = "card-" + id;
  div.dataset.index = idx;
  div.dataset.titular = esT ? "1" : "0";

  div.innerHTML = buildCardHTML(id, esT, titulo, idx);
  return div;
}

function buildCardHTML(id, esT, titulo, idx) {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="ms" style="color:var(--${esT ? 'primary' : 'secondary'});font-size:22px;font-variation-settings:'FILL' 1;">${esT ? 'person' : 'person_add'}</span>
        <div>
          <div class="font-serif" style="font-size:16px;font-weight:700;">${titulo}</div>
          ${esT ? '<div style="font-size:11px;color:#7f7663;text-transform:uppercase;letter-spacing:.06em;">Titular de la reserva</div>' : ''}
        </div>
      </div>
      ${!esT ? `<button onclick="eliminarHuesped('${id}')" style="background:none;border:none;cursor:pointer;color:var(--error);padding:6px;border-radius:8px;"><span class="ms">delete_outline</span></button>` : ''}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div style="grid-column:1/-1;">
        <label class="field-label">Nombre Completo *</label>
        <input class="field-input" id="${id}-nombre" type="text" placeholder="Ej. Juan Pérez"
          value="${esT && nombreParam ? nombreParam : ''}" oninput="guardarCampo('${id}','nombre',this.value)"/>
      </div>

      ${esT ? `
      <div style="grid-column:1/-1;">
        <label class="field-label">Email *</label>
        <input class="field-input" id="${id}-email" type="email" placeholder="correo@ejemplo.com" oninput="guardarCampo('${id}','email',this.value)"/>
      </div>
      <div>
        <label class="field-label">País</label>
        <select class="field-input" id="${id}-codigo" onchange="guardarCampo('${id}','codigo',this.value)">
          <option value="51">PE +51</option><option value="54">AR +54</option>
          <option value="56">CL +56</option><option value="57">CO +57</option>
          <option value="1">US +1</option><option value="44">UK +44</option>
          <option value="34">ES +34</option><option value="49">DE +49</option>
          <option value="55">BR +55</option>
        </select>
      </div>
      <div>
        <label class="field-label">Teléfono *</label>
        <input class="field-input" id="${id}-telefono" type="tel" placeholder="987 341 632" oninput="guardarCampo('${id}','telefono',this.value)"/>
      </div>
      <div style="grid-column:1/-1;">
        <label class="field-label">Contacto Preferido</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="${id}-canal" value="WhatsApp" checked onchange="guardarCampo('${id}','canal',this.value)"/><span>WhatsApp</span></label>
          <label class="radio-opt"><input type="radio" name="${id}-canal" value="WeChat" onchange="guardarCampo('${id}','canal',this.value)"/><span>WeChat</span></label>
          <label class="radio-opt"><input type="radio" name="${id}-canal" value="Llamada" onchange="guardarCampo('${id}','canal',this.value)"/><span>Llamada</span></label>
        </div>
      </div>` : `
      <div style="grid-column:1/-1;">
        <label class="field-label">Tipo de Huésped</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="${id}-tipo" value="adulto" checked onchange="guardarCampo('${id}','tipo',this.value)"/><span>Adulto</span></label>
          <label class="radio-opt"><input type="radio" name="${id}-tipo" value="nino" onchange="guardarCampo('${id}','tipo',this.value)"/><span>Niño</span></label>
        </div>
      </div>`}

      <div style="grid-column:1/-1;">
        <label class="field-label">Tipo de Documento</label>
        <div class="radio-group" style="margin-bottom:10px;">
          <label class="radio-opt"><input type="radio" name="${id}-tipdoc" value="DNI" checked onchange="guardarCampo('${id}','tipdoc',this.value)"/><span>DNI</span></label>
          <label class="radio-opt"><input type="radio" name="${id}-tipdoc" value="Pasaporte" onchange="guardarCampo('${id}','tipdoc',this.value)"/><span>Pasaporte</span></label>
          <label class="radio-opt"><input type="radio" name="${id}-tipdoc" value="Cédula" onchange="guardarCampo('${id}','tipdoc',this.value)"/><span>Cédula</span></label>
        </div>
        <input class="field-input" id="${id}-nrodoc" type="text" placeholder="Número de documento" oninput="guardarCampo('${id}','nrodoc',this.value)"/>
      </div>

      <div style="grid-column:1/-1;">
        <label class="field-label">Foto del Documento *</label>
        <div class="avif-info" style="margin-bottom:10px;">
          <span class="ms" style="color:var(--primary);font-size:18px;">photo_camera</span>
          <span>La imagen se optimizará a formato AVIF automáticamente (~150KB máx).</span>
        </div>
        <div class="upload-zone" id="zone-${id}" ondragover="dragOver(event,'${id}')" ondragleave="dragLeave('${id}')" ondrop="dropFile(event,'${id}')">
          <input type="file" accept="image/*" capture="environment" onchange="procesarFoto(this,'${id}')"/>
          <div id="upload-content-${id}">
            <span class="ms" style="font-size:36px;color:var(--outline);">add_a_photo</span>
            <p style="font-size:13px;color:#7f7663;text-align:center;margin:4px 0 0;">Toca para fotografiar o cargar<br/><strong>DNI · Pasaporte · Cédula</strong></p>
          </div>
        </div>
        <div id="foto-status-${id}" style="font-size:12px;color:var(--primary);margin-top:6px;display:none;"></div>
      </div>
    </div>
  `;
}

// ── Inicializar ────────────────────────────────────────────
function init() {
  contadorHuespedes = 0;
  const container = document.getElementById("guests-container");
  container.innerHTML = "";
  const card = crearCardHuesped(true, contadorHuespedes++);
  container.appendChild(card);
  huespedes = [{ id: "h0", datos: {}, foto: null }];
}

function agregarHuesped() {
  const container = document.getElementById("guests-container");
  const idx = contadorHuespedes++;
  const card = crearCardHuesped(false, idx);
  container.appendChild(card);
  huespedes.push({ id: "h" + idx, datos: {}, foto: null });
  card.scrollIntoView({ behavior: "smooth", block: "start" });

  if (contadorHuespedes >= 6) {
    document.getElementById("btn-agregar").style.display = "none";
  }
}

function eliminarHuesped(id) {
  const card = document.getElementById("card-" + id);
  if (card) {
    card.style.animation = "slideIn .3s ease reverse";
    setTimeout(() => card.remove(), 280);
  }
  huespedes = huespedes.filter(h => h.id !== id);
  if (contadorHuespedes < 6) {
    document.getElementById("btn-agregar").style.display = "flex";
  }
}

// ── Guardar campo ──────────────────────────────────────────
function guardarCampo(hId, campo, valor) {
  const h = huespedes.find(h => h.id === hId);
  if (h) h.datos[campo] = valor;
}

// ── Drag & Drop ────────────────────────────────────────────
function dragOver(e, id) { e.preventDefault(); document.getElementById("zone-" + id).classList.add("dragover"); }
function dragLeave(id) { document.getElementById("zone-" + id).classList.remove("dragover"); }
function dropFile(e, id) {
  e.preventDefault();
  dragLeave(id);
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith("image/")) procesarFotoArchivo(file, id);
}

// ── Procesar foto y convertir a AVIF ──────────────────────
function procesarFoto(input, id) {
  if (input.files[0]) procesarFotoArchivo(input.files[0], id);
}

async function procesarFotoArchivo(file, hId) {
  const statusEl = document.getElementById("foto-status-" + hId);
  const contentEl = document.getElementById("upload-content-" + hId);
  const zone = document.getElementById("zone-" + hId);

  statusEl.textContent = "⏳ Optimizando imagen...";
  statusEl.style.display = "block";
  statusEl.style.color = "#4d4635";

  try {
    const result = await convertirImagenAvif(file);

    // Vista previa
    contentEl.innerHTML = `
      <div class="upload-preview">
        <img src="${result.dataUrl}" alt="Documento"/>
        <div class="upload-badge">✓ AVIF ${result.kb}KB</div>
      </div>
    `;
    zone.style.border = "2px solid var(--primary)";
    zone.style.padding = "8px";

    statusEl.textContent = `✅ Imagen optimizada: ${result.originalKb}KB → ${result.kb}KB (${result.ahorro}% más pequeña)`;
    statusEl.style.color = "var(--primary)";

    // Guardar en el estado
    const h = huespedes.find(h => h.id === hId);
    if (h) h.foto = result.dataUrl;

  } catch (err) {
    statusEl.textContent = "❌ Error al procesar la imagen. Intenta con otra foto.";
    statusEl.style.color = "var(--error)";
  }
}

// ── Conversión a AVIF/WebP en el navegador ────────────────
async function convertirImagenAvif(file, maxKB = 150) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const originalKb = Math.round(file.size / 1024);
    const url = URL.createObjectURL(file);

    img.onload = () => {
      // Reducir resolución si es grande
      let w = img.width, h = img.height;
      const MAX = 1400;
      if (w > MAX || h > MAX) {
        const r = Math.min(MAX / w, MAX / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }

      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);

      // Detectar soporte AVIF
      const testCanvas = document.createElement("canvas");
      testCanvas.width = 1; testCanvas.height = 1;
      const supAvif = testCanvas.toDataURL("image/avif").startsWith("data:image/avif");
      const fmt = supAvif ? "image/avif" : "image/webp";

      // Calidad adaptativa
      let q = 0.82;
      let dataUrl = canvas.toDataURL(fmt, q);

      while ((dataUrl.length * 0.75) > maxKB * 1024 && q > 0.3) {
        q -= 0.08;
        dataUrl = canvas.toDataURL(fmt, q);
      }

      const kb = Math.round(dataUrl.length * 0.75 / 1024);
      const ahorro = originalKb > 0 ? Math.round((1 - kb / originalKb) * 100) : 0;
      resolve({ dataUrl, kb, originalKb, ahorro, formato: fmt });
    };

    img.onerror = reject;
    img.src = url;
  });
}

// ── Validación ─────────────────────────────────────────────
function validar() {
  let valido = true;
  huespedes.forEach((h, i) => {
    const nombreEl = document.getElementById(h.id + "-nombre");
    if (!nombreEl || !nombreEl.value.trim()) {
      if (nombreEl) { nombreEl.classList.add("error"); nombreEl.focus(); }
      valido = false;
    } else {
      if (nombreEl) nombreEl.classList.remove("error");
    }

    if (i === 0) {  // Titular: email y teléfono requeridos
      const emailEl = document.getElementById(h.id + "-email");
      const telEl = document.getElementById(h.id + "-telefono");
      if (!emailEl?.value.includes("@")) {
        if (emailEl) emailEl.classList.add("error");
        valido = false;
      } else { if (emailEl) emailEl.classList.remove("error"); }
      if (!telEl?.value.trim()) {
        if (telEl) telEl.classList.add("error");
        valido = false;
      } else { if (telEl) telEl.classList.remove("error"); }
    }
  });
  return valido;
}

// ── Continuar ──────────────────────────────────────────────
async function continuar() {
  if (!validar()) {
    mostrarToast("Por favor completa los campos obligatorios (*).", "error");
    return;
  }

  // Recopilar datos
  const titular = huespedes[0];
  const tId = titular.id;

  const datos = {
    id_reserva: idReserva,
    nombre_titular: document.getElementById(tId + "-nombre")?.value.trim() || "",
    email: document.getElementById(tId + "-email")?.value.trim() || "",
    telefono: (document.getElementById(tId + "-codigo")?.value || "51") + (document.getElementById(tId + "-telefono")?.value.trim() || ""),
    contacto_preferido: document.querySelector(`input[name="${tId}-canal"]:checked`)?.value || "WhatsApp",
    nro_documento: document.getElementById(tId + "-nrodoc")?.value.trim() || "",
    pais: document.getElementById(tId + "-codigo")?.value || "51",
    acompanantes: huespedes.slice(1).map(h => ({
      nombre: document.getElementById(h.id + "-nombre")?.value.trim() || "",
      tipo: document.querySelector(`input[name="${h.id}-tipo"]:checked`)?.value || "adulto",
      tipdoc: document.querySelector(`input[name="${h.id}-tipdoc"]:checked`)?.value || "DNI",
      nrodoc: document.getElementById(h.id + "-nrodoc")?.value.trim() || ""
    })),
    fotos: huespedes.map((h, i) => ({ indice: i, dataUrl: h.foto })).filter(f => f.dataUrl)
  };

  // Guardar en localStorage para la siguiente página
  localStorage.setItem("quenas_" + idReserva + "_huespedes", JSON.stringify(datos));

  // Navegar a la siguiente página
  const params = new URLSearchParams({ r: idReserva });
  if (getParam("n")) params.set("n", getParam("n"));
  if (getParam("f")) params.set("f", getParam("f"));
  window.location.href = "3_detalles_viaje.html?" + params.toString();
}

// ── Toast ──────────────────────────────────────────────────
function mostrarToast(msg, tipo = "ok") {
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:${tipo === "ok" ? "#755b00" : "#ba1a1a"};color:white;padding:12px 20px;
    border-radius:100px;font-size:13px;z-index:9999;max-width:90%;text-align:center;
    box-shadow:0 4px 16px rgba(0,0,0,0.2);`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
